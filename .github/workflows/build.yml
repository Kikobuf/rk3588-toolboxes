name: Build and publish rk3588 toolboxes

on:
  schedule:
    # Check weekly — rknn-llm releases less frequently than tt-metal/vLLM
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      rkllama_ref:
        description: "NotPunchnox/rkllama commit SHA to build against (defaults to the pinned commit in toolboxes/rkllama/Dockerfile)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "toolboxes/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/kikobuf/rk3588-toolboxes

jobs:
  build-rkllama:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rkllama
        uses: docker/build-push-action@v6
        with:
          context: toolboxes/rkllama
          platforms: linux/arm64
          push: true
          build-args: |
            RKLLAMA_REF=${{ github.event.inputs.rkllama_ref || '76bda5a4daf143babcd3e9a3d69e63f879c86e04' }}
          tags: |
            ${{ env.IMAGE_BASE }}:rkllama
            ${{ env.IMAGE_BASE }}:rkllama-${{ github.event.inputs.rkllama_ref || '76bda5a4daf143babcd3e9a3d69e63f879c86e04' }}

  build-rk-llama-cpp:
    # Experimental fork — build on manual dispatch only, not the weekly schedule,
    # since it's less stable and more likely to break a scheduled build.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rk-llama-cpp (experimental)
        uses: docker/build-push-action@v6
        with:
          context: toolboxes/rk-llama-cpp
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:rk-llama-cpp
